name: End-to-end Tests

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        defaults:
            run:
                working-directory: circles

        env:
            # Exercise the production build, not the dev server: `bun run e2e` starts what CI just built.
            E2E_WEB_SERVER_COMMAND: bun run e2e:server:start
            E2E_PORT: "3100"
            NEXT_TELEMETRY_DISABLED: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            # Browsers are ~100 MB and unchanged between runs; downloading them every time is the
            # slowest part of an otherwise quick job.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            - name: Install Playwright browser
              run: bunx playwright install --with-deps chromium

            # The same compose file developers use, so CI cannot drift from a local run.
            - name: Start backing services
              run: bun run e2e:services

            - name: Build application
              run: bun run build
              env:
                  NEXT_PUBLIC_APP_URL: http://localhost:3100

            - name: Run end-to-end tests
              run: bun run e2e

            # Uploaded on failure too — that is when the trace, video and screenshot are worth having.
            - name: Upload test report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: circles/e2e/.report
                  retention-days: 14

            - name: Upload failure traces, videos and screenshots
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-failures
                  path: circles/e2e/.results
                  retention-days: 14

            - name: Stop backing services
              if: always()
              run: bun run e2e:services:down
