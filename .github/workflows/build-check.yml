name: Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: circles

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production onboarding safety contracts
        run: |
          ./scripts/test-production-onboarding-control.sh
          ./scripts/test-production-git-sync.sh
          ./scripts/pending-registration-ops-container.test.sh
          ./scripts/test-production-onboarding-rehearsal.sh

      - name: Build and execute registration operator image read-only
        run: ./scripts/test-pending-registration-ops-image.sh

      - name: Build project
        run: bun run build
