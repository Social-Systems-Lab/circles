name: kamooni_staging

services:
    circles:
        image: kamooni-staging-circles:${STAGING_IMAGE_TAG:?STAGING_IMAGE_TAG is required}
        env_file: !override
            - ${STAGING_INFRA_APP_DIR:?STAGING_INFRA_APP_DIR is required}/.env.staging
        build:
            context: ${STAGING_TARGET_APP_DIR:?STAGING_TARGET_APP_DIR is required}
            dockerfile: Dockerfile
        environment:
            PORT: "3000"
            NODE_ENV: production
            CIRCLES_URL: https://staging.kamooni.org
            NEXT_PUBLIC_APP_URL: https://staging.kamooni.org
            NEXT_PUBLIC_SITE_URL: https://staging.kamooni.org
            NEXT_PUBLIC_CHAT_PROVIDER: mongo
            NEXT_PUBLIC_MAINTENANCE_MODE: "false"
            VDB_ENABLED: "false"
            PAYMENTS_ENABLED: "false"
            CIRCLES_HOST: circles
            CIRCLES_PORT: "3000"
            MONGO_HOST: db
            MONGO_PORT: "27017"
            MINIO_HOST: minio
            MINIO_PORT: "9000"
            MINIO_BUCKET: circles
            MINIO_PRIVATE_BUCKET: circles-private
            CIRCLES_REGISTRY_URL: ""
            OPENAI_API_KEY: ""
            MAPBOX_API_KEY: ""
            NEXT_PUBLIC_MAPBOX_TOKEN: ""
            POSTMARK_API_TOKEN: ""
            POSTMARK_SENDER_EMAIL: ""
            TELEGRAM_BOT_TOKEN: ""
            TELEGRAM_BOT_USERNAME: ""
            DONORBOX_EMAIL: ""
            DONORBOX_API_USER: ""
            DONORBOX_API_KEY: ""
            DONORBOX_WEBHOOK_SECRET: ""
            STRIPE_SECRET_KEY: ""
            STRIPE_WEBHOOK_SECRET: ""
            STRIPE_PRICE_MONTHLY: ""
            STRIPE_PRICE_YEARLY: ""
            STRIPE_PRICE_MONTHLY_1: ""
            STRIPE_PRICE_MONTHLY_2: ""
            STRIPE_PRICE_MONTHLY_5: ""
            STRIPE_PRICE_MONTHLY_10: ""
            VIBE_ID_CREDENTIAL_ISSUER_PRIVATE_JWK: ""
            KAMOONI_VIBE_ID_ISSUER_PRIVATE_JWK: ""
            VIBE_ID_CREDENTIAL_ISSUER_DID: ""
        ports: !override []
        expose:
            - "3000"
        restart: unless-stopped

    db:
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging
        ports: !override []
        expose:
            - "27017"
        restart: unless-stopped

    minio:
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging
        ports: !override []
        expose:
            - "9000"
        restart: unless-stopped

    nginx:
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging
        volumes: !override
            - ${STAGING_INFRA_APP_DIR}/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
            - /var/www/certbot:/usr/share/nginx/html
        ports: !override
            - "80:80"
            - "443:443"
        networks: !override
            - webnet
        restart: unless-stopped

    qdrant:
        profiles: ["vdb"]

    cron:
        profiles: ["cron"]
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging

    watchtower:
        profiles: ["watchtower"]

    minio_loopback:
        profiles: ["loopback"]

    nginx_loopback:
        profiles: ["loopback"]

    postgres:
        profiles: ["matrix"]
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging

    synapse:
        profiles: ["matrix"]
        env_file: !override
            - ${STAGING_INFRA_APP_DIR}/.env.staging
        ports: !override []

volumes: !override
    db: {}
    storage: {}
    qdrant_data: {}
    postgres_data: {}
    synapse_data: {}
    circles_users: {}
    circles: {}

networks:
    webnet:
