[test]
preload = ["./src/test/setup.ts"]

# Files bun test must not run.
#
#  - **/e2e/**  Bun's default test patterns include *.spec.ts, which is what Playwright uses. Those files
#    are run by `bun run e2e` and cannot run under bun test.
#
#  - Two older script-style tests that cannot pass under Bun at all (they fail the same way with
#    `bun <file>`, without this preload). Run them by hand once they are fixed.
#      secret-media-call-graph.test.ts  needs the ripgrep binary (`rg`) on PATH, which is not installed.
#      private-media/**/route.test.ts   expects a default `content-type` header on `new Response("...")`.
#                                       Bun's Response does not expose one (Node's does), so it gets `{}`.
pathIgnorePatterns = ["**/e2e/**", "**/secret-media-call-graph.test.ts", "**/private-media/**/route.test.ts"]
